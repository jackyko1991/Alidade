<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b1e29"/>
      <stop offset="100%" stop-color="#0c0d13"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0c368"/>
      <stop offset="100%" stop-color="#c8933a"/>
    </linearGradient>
  </defs>

  <!-- app-icon background (squircle-ish rounded square) -->
  <rect x="0" y="0" width="100" height="100" rx="22" ry="22" fill="url(#bg)"/>

  <!-- alidade sighting arms -->
  <g fill="none" stroke="#f4efe4" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 50 26 L 29.5 73"/>
    <path d="M 50 26 L 70.5 73"/>
  </g>

  <!-- pivot at the sighting apex -->
  <circle cx="50" cy="26" r="3.2" fill="#f4efe4"/>
  <circle cx="50" cy="26" r="1.1" fill="#0c0d13"/>

  <!-- gold base arc (the alidade's graduated scale) -->
  <path d="M 26 74 Q 50 89 74 74" fill="none" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>

  <!-- guiding star, upper right of the apex -->
  <g fill="url(#gold)">
    <path d="M 76 16
             L 78.3 22.7
             L 85 25
             L 78.3 27.3
             L 76 34
             L 73.7 27.3
             L 67 25
             L 73.7 22.7
             Z"/>
    <path d="M 86.5 32
             L 87.6 35.1
             L 90.7 36.2
             L 87.6 37.3
             L 86.5 40.4
             L 85.4 37.3
             L 82.3 36.2
             L 85.4 35.1
             Z"/>
  </g>
</svg>
